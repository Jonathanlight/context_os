# Target mapping: claude_code
#
# Tells the generic Markdown parser how a CLAUDE.md (or any agent context
# file targeting Claude) lays out its sections, so we can extract them
# into an AgentDocument without hard-coding the structure.
#
# Aliases are case-insensitive. The parser matches the rendered heading
# text against every alias for every section.

target = "claude_code"

[sections.identity]
aliases = [
    "Identity",
    "About me",
    "Who I am",
    "Role",
    "Author",
    "Context",
]

[sections.stack]
aliases = [
    "Stack",
    "Required stack",
    "Tech stack",
    "Technical stack",
    "Tools and stack",
]
[sections.stack.sub_sections]
required = ["Required", "Must use"]
forbidden = ["Forbidden", "Never use", "Don't use", "Banned"]
preferred = ["Preferred", "Prefer", "Optional", "Recommended"]

[sections.rules]
aliases = [
    "Rules",
    "Required practices",
    "Mandatory",
    "Conventions",
    "Core development principles",
    "Required patterns",
]

[sections.style]
aliases = [
    "Style",
    "Code style",
    "Coding style",
    "Style and conventions",
]

[sections.forbidden_patterns]
aliases = [
    "Forbidden patterns",
    "Forbidden",
    "Anti-patterns",
    "Don't do this",
    "Never do this",
]

[sections.tools]
aliases = [
    "Tools",
    "Tooling",
    "Required tooling",
    "Tools to use",
]
[sections.tools.sub_sections]
required = ["Required", "Must use"]
forbidden = ["Forbidden", "Never use", "Don't use", "Banned"]


# Lexical severity inference for bullet rules without an explicit severity
# field. The parser scans the first 4 leading tokens of each rule, lowercased,
# and picks the first match. Default severity for rules with no match: must.
[severity_keywords]
must = [
    "never",
    "don't",
    "do not",
    "must",
    "always",
    "required",
    "critical",
]
should = [
    "should",
    "prefer",
    "recommended",
    "avoid",
]
may = [
    "may",
    "can",
    "could",
    "optional",
    "consider",
]
