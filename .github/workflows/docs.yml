name: Docs

on:
  push:
    branches: [develop, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs deps
        run: pip install -e ".[docs]"

      - name: Build site
        run: mkdocs build --strict --site-dir _site

      # The deploy steps below require GitHub Pages to be enabled on
      # the repo (Settings -> Pages -> Source = GitHub Actions). Until
      # that one-time setup is done, the configure-pages step returns
      # 404 and we degrade to "build verified, deploy skipped" rather
      # than failing the whole workflow on every push.
      - uses: actions/configure-pages@v5
        id: configure
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.configure.outcome == 'success'
        with:
          path: _site

      - id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4
