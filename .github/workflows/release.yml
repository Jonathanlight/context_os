name: Release

# Triggered by pushing a ``v*`` tag. Two paths to publishing on PyPI
# are supported — pick **one** at setup time per the docs/release.md
# checklist:
#
# 1. **API token (faster setup, slightly weaker security)**.
#    Create a PyPI project + token, store as ``PYPI_API_TOKEN`` repo
#    secret. The action below uses ``password`` and ignores OIDC.
#
# 2. **Trusted publishing (OIDC, recommended once set up)**.
#    Configure a Trusted Publisher on PyPI pointing at
#    ``Jonathanlight/context_os`` / workflow ``release.yml`` /
#    environment ``pypi``. Leave the ``PYPI_API_TOKEN`` secret unset;
#    the action falls through to OIDC.
#
# The "Detect publish mode" step below prints which path will run so
# operators can confirm the setup before the actual publish.

on:
  push:
    tags:
      - "v*"
  # ``workflow_dispatch`` enables manual re-runs from the Actions UI or
  # ``gh workflow run release.yml --ref vX.Y.Z`` for hotfix re-publishes.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required for the OIDC trusted-publishing path

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify package version matches the tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python -m pip install -e .
          PKG_VERSION=$(python -c "import contextos; print(contextos.__version__)")
          # On tag pushes (`github.ref_type == 'tag'`) we strictly verify
          # that the tag name matches the package version. On manual
          # workflow_dispatch from a branch we skip the strict check and
          # just publish whatever the wheel carries — the operator
          # initiated the run knowingly and the next "Detect publish
          # mode" step will name what's about to ship.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "tag $TAG_VERSION does not match package $PKG_VERSION"
              exit 1
            fi
            echo "::notice ::Publishing tag $GITHUB_REF_NAME as package version $PKG_VERSION."
          else
            echo "::notice ::Manual dispatch from $GITHUB_REF_NAME — publishing package version $PKG_VERSION (no tag check)."
          fi

      - name: Detect publish mode
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "::notice ::Publishing via API token (PYPI_API_TOKEN secret)."
          else
            echo "::notice ::Publishing via trusted publishing (OIDC). Requires PyPI-side configuration."
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # When the secret is empty (the OIDC path), pypa/gh-action-pypi-publish
          # ignores the empty string and falls through to trusted publishing.
          # When the secret carries a token, it takes precedence.
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: CHANGELOG.md
